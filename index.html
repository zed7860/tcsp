<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <meta name="description" content="The TCSP website.">
    <title>TCSP</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20251f;
        background: #f5f3ee;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 68rem);
        min-height: min(76vh, 42rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(2rem, 7vw, 6rem);
        border: 1px solid #deddd4;
        border-radius: 1.5rem;
        background: #fffefa;
      }

      .eyebrow {
        margin: 0;
        color: #56664d;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 1.5rem 0;
        font-size: clamp(3.5rem, 12vw, 8rem);
        font-weight: 600;
        letter-spacing: -0.08em;
        line-height: 0.95;
      }

      .intro {
        max-width: 34rem;
        margin: 0;
        color: #61645d;
        font-size: clamp(1.1rem, 2vw, 1.35rem);
        line-height: 1.6;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 4rem;
        padding-top: 1.25rem;
        border-top: 1px solid #e7e5dd;
        color: #777970;
        font-size: 0.85rem;
      }

      @media (max-width: 480px) {
        main {
          padding: 1rem;
        }

        .card {
          min-height: calc(100vh - 2rem);
          border-radius: 1rem;
        }

        footer {
          flex-direction: column;
          gap: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="site-title">
        <div>
          <p class="eyebrow">Welcome to</p>
          <h1 id="site-title">TCSP</h1>
          <p class="intro">A new space, ready for what comes next.</p>
        </div>
        <footer>
          <span>TCSP</span>
          <span>More to come.</span>
        </footer>
      </section>
    </main>
  </body>
</html>
